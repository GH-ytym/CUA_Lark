[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cua-lark-backend"
version = "0.1.0"
description = "FastAPI backend for the CLI-first and CUA-fallback Feishu desktop agent"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic-settings>=2.10.0",
  "httpx>=0.28.0",
  "python-dotenv>=1.1.0",
  "structlog>=25.4.0",
  "sse-starlette>=2.1.3",
  "redis>=6.1.0",
  "tenacity>=9.1.0",
  "orjson>=3.10.18"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"